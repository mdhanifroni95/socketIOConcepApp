<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket io App</title>
  </head>
  <body>
    <!-- <h1 id="myTime"></h1> -->
    <input type="text" id="name" />
    <button onclick="send()" id="send">Send</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let socket = io();
      // socket.on("myEvent", (msg) => {
      //   document.getElementById("myTime").innerHTML = "";
      //   document.getElementById("myTime").innerHTML = msg;
      // });

      //client to server data send
      function send() {
        let name = document.getElementById("name").value;

        //default send function
        /**socket.send(name);*/
        //Custom event
        socket.emit("myEventClientToServer", name);
      }
    </script>
  </body>
</html>
